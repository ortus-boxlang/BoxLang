/**
 * BoxLang Android — Compose sample app (Track 1, native widgets).
 *
 * The UI *tree* and all app logic are authored in BoxLang (src/main/bx); a thin Kotlin
 * host renders that tree into real Jetpack Compose widgets via the library's
 * ComposeTreeRenderer. Compose is Kotlin-first, so Track 1 carries a small Kotlin host
 * (documented trade-off) — the WebView sample, by contrast, ships zero Kotlin/Java.
 *
 * Requires the Android SDK (settings.gradle only includes it when ANDROID_HOME is set).
 */
plugins {
	id 'com.android.application'
	id 'org.jetbrains.kotlin.android'
}

android {
	namespace 'com.example.boxcompose'
	compileSdk 34

	defaultConfig {
		applicationId 'com.example.boxcompose'
		minSdk 26
		targetSdk 34
		versionCode 1
		versionName '1.0'
	}

	compileOptions {
		sourceCompatibility JavaVersion.VERSION_17
		targetCompatibility JavaVersion.VERSION_17
		coreLibraryDesugaringEnabled true
	}

	kotlinOptions {
		jvmTarget = '17'
	}

	buildFeatures {
		compose true
	}

	composeOptions {
		kotlinCompilerExtensionVersion '1.5.14'
	}

	sourceSets {
		main {
			assets.srcDirs += [ "${buildDir}/boxapp-assets" ]
		}
	}

	buildTypes {
		release {
			minifyEnabled true
			proguardFiles getDefaultProguardFile( 'proguard-android-optimize.txt' ), 'proguard-rules.pro'
		}
	}
}

dependencies {
	implementation project( ':runtimes:android' )
	coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'
	implementation platform( 'androidx.compose:compose-bom:2024.06.00' )
	implementation 'androidx.activity:activity-compose:1.9.1'
}

tasks.register( 'stageBoxApp', Copy ) {
	from 'src/main/bx'
	into "${buildDir}/boxapp-assets/bx"
}

/** See the WebView sample for notes on the on-device AOT execution model. */
tasks.register( 'compileBoxLangAot', JavaExec ) {
	group		= 'boxlang'
	description	= 'Pre-compiles src/main/bx (.bx) to JVM bytecode for AOT packaging.'
	classpath	= project( ':' ).sourceSets.main.runtimeClasspath
	mainClass	= 'ortus.boxlang.compiler.BXCompiler'
	args		= [ '--source', "${projectDir}/src/main/bx", '--target', "${buildDir}/boxapp-classes", '--stopOnError' ]
}

tasks.matching { it.name.startsWith( 'merge' ) && it.name.endsWith( 'Assets' ) }.configureEach {
	dependsOn 'stageBoxApp'
}
