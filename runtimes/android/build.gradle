/**
 * BoxLang Android Runtime — AGP library module (publishes an .aar).
 *
 * This module contains the Android-SPECIFIC glue for running BoxLang on Android:
 * the runtime bootstrap, the generic manifest-declared Application/Activity, the WebView
 * renderer + JS bridge, and the Android lifecycle -> Application.bx hook dispatcher. The
 * portable, Android-free MVC framework lives in :runtimes:android-mvc and is consumed here.
 *
 * 100% Java — no Kotlin. The UI is the WebView track: BoxLang .bxm templates rendered to
 * HTML and loaded into a WebView.
 *
 * Requires the Android SDK + Android Gradle Plugin. settings.gradle only includes this
 * module when ANDROID_HOME / ANDROID_SDK_ROOT is present, so the core BoxLang build and
 * CI never need the Android toolchain.
 *
 * NOTE: on-device, BoxLang runs in AHEAD-OF-TIME mode (NoOp compiler) because ART cannot
 * defineClass() raw JVM bytecode at runtime. .bx/.bxm sources are compiled to .class by
 * BXCompiler at build time (see the consuming app's compileBoxLangAot task) and dexed
 * into the APK by D8/R8.
 */
plugins {
	id 'com.android.library'
}

repositories {
	google()
	mavenCentral()
}

android {
	namespace 'ortus.boxlang.runtime.android'
	compileSdk 35

	defaultConfig {
		minSdk 26					// InMemoryDexClassLoader (hot reload) requires API 26+
		consumerProguardFiles 'consumer-rules.pro'
	}

	compileOptions {
		sourceCompatibility JavaVersion.VERSION_17
		targetCompatibility JavaVersion.VERSION_17
		// Library desugaring lets D8/R8 dex the Java 17/21 APIs BoxLang core uses.
		coreLibraryDesugaringEnabled true
	}

	buildTypes {
		release {
			minifyEnabled true
			proguardFiles getDefaultProguardFile( 'proguard-android-optimize.txt' ), 'proguard-rules.pro'
		}
	}

	testOptions {
		unitTests {
			includeAndroidResources = true
			returnDefaultValues = true
		}
	}
}

dependencies {
	// Portable MVC framework (pure JVM, no Android deps)
	api project( ':runtimes:android-mvc' )

	// BoxLang runtime — on a real build this is the slim NoOp distribution.
	// Within this repo we depend on the core project; a standalone repo would use
	// e.g. implementation "io.boxlang:boxlang:${boxlangVersion}".
	//
	// On device BoxLang runs AHEAD-OF-TIME (NoOp): it loads pre-compiled classes and never
	// parses .bx/.bxm source, so the entire parser toolchain is dead weight in the APK. Drop
	// ANTLR (runtime + grammars), JavaParser, and JavaParser's transitive Guava/Javassist —
	// the same families the NoOp distribution jar excludes — to slim what D8 has to dex.
	api ( project( ':' ) ) {
		exclude group: 'org.antlr'
		exclude group: 'com.github.javaparser'
		exclude group: 'com.google.guava'
		exclude group: 'org.javassist'
	}

	// Java 8+ API desugaring for ART
	coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'

	// AndroidX (Java-only; no Kotlin/Compose)
	implementation 'androidx.appcompat:appcompat:1.7.0'

	// Unit tests (Robolectric runs Android framework classes on the JVM)
	testImplementation 'junit:junit:4.13.2'
	testImplementation 'org.robolectric:robolectric:4.13'
	testImplementation 'androidx.test:core:1.6.1'
	testImplementation 'com.google.truth:truth:1.4.4'
}
