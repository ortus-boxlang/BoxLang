// Plugin resolution for the optional Android modules. The Android Gradle Plugin lives in
// Google's Maven repo and must be version-pinned here so the AGP modules' `plugins { id
// 'com.android.*' }` (declared without a version) resolve. These mappings are inert for the
// core build — they only take effect when an android-* module is actually included (i.e. when
// ANDROID_HOME / ANDROID_SDK_ROOT is set; see the include guard below). The AGP/Kotlin
// versions may need aligning with the locally installed Android SDK.
pluginManagement {
	repositories {
		gradlePluginPortal()
		mavenCentral()
		google()
	}
	plugins {
		id 'com.android.application' version '9.2.1'
		id 'com.android.library' version '9.2.1'
	}
}

rootProject.name = "boxlang"

// Gradle uses ':' instead of '/' to separate the path segments
include ":src:modules:test"
project( ":src:modules:test" ).projectDir = new File( "src/modules/test" )

// BoxLang Android — portable MVC core (pure JVM, no Android SDK required).
// Always included so it compiles/tests as part of the normal build.
include ":runtimes:android-mvc"
project( ":runtimes:android-mvc" ).projectDir = new File( "runtimes/android-mvc" )

// BoxLang Android — AGP library + sample apps. These require the Android SDK and the
// Android Gradle Plugin, so they are ONLY included when ANDROID_HOME / ANDROID_SDK_ROOT
// is present. This keeps core `./gradlew build` and CI free of the Android toolchain.
if ( System.getenv( "ANDROID_HOME" ) != null || System.getenv( "ANDROID_SDK_ROOT" ) != null ) {
	include ":runtimes:android"
	project( ":runtimes:android" ).projectDir = new File( "runtimes/android" )
	include ":runtimes:android-sample-web"
	project( ":runtimes:android-sample-web" ).projectDir = new File( "runtimes/android-sample-web" )
}
