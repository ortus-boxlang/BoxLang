plugins {
    id 'java'
	// https://github.com/harbby/gradle-serviceloader
    id "com.github.harbby.gradle.serviceloader" version "1.1.9"
	// Shadow
	id "com.gradleup.shadow" version "9.4.3"
}

version = '1.0.0'
repositories {
    mavenCentral()
}

dependencies {
    compileOnly project( ':' )
}

java {
    sourceCompatibility = JavaVersion.toVersion( jdkVersion )
    targetCompatibility = JavaVersion.toVersion( jdkVersion )
}

compileJava {
    options.incremental = true
    options.encoding = 'UTF-8'
    options.debug = true
}

/**
 * Generates META-INF/services/ortus.boxlang.runtime.modules.IModuleConfig
 * automatically via the gradle-serviceloader plugin.
 */
serviceLoader {
    serviceInterface 'ortus.boxlang.runtime.modules.IModuleConfig'
}

jar {
    archiveVersion = "${version}"
    manifest {
        attributes 'Description': 'Java Test Module for BoxLang'
    }
}

shadowJar {
    mergeServiceFiles()
    destinationDirectory = file( "build/libs" )
}

/**
 * Copies the built JAR (with service file merged in) plus the box.json
 * into the canonical module location used by the test suite.
 */
task createModuleStructure( type: Copy ) {
    dependsOn( shadowJar )
    from( 'build/libs' ) {
        include "${project.name}-${version}-all.jar"
        into 'libs'
    }
    from( '.' ) {
        include 'box.json'
    }
    destinationDir = file( 'build/module' )
}

task copyTestModuleToCore( type: Copy ) {
    dependsOn createModuleStructure
    from( 'build/module' )
    into '../../../modules/javaTestModule'
}

/**
 * Drops the same shadow JAR into the test resources as a bare *.jar module, exercising the
 * "a jar in a modules folder IS a module" convention (module inception). The jar carries its
 * own META-INF/services entry, so its IModuleConfig is found via ServiceLoader with no
 * surrounding folder structure at all.
 */
task copyJarModuleFixture( type: Copy ) {
    dependsOn( shadowJar )
    from( 'build/libs' ) {
        include "${project.name}-${version}-all.jar"
        rename '.*', 'javaJarModule.jar'
    }
    destinationDir = file( '../../../src/test/jar-modules' )
}

shadowJar.finalizedBy( createModuleStructure, copyTestModuleToCore, copyJarModuleFixture )

clean {
    // Only delete generated artifacts under the repo-root test fixture, not the fixture itself
    delete '../../../modules/javaTestModule/libs'
    delete '../../../src/test/jar-modules'
}
